<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShopiMind — Console d'exploitation</title>
    <style nonce="__CSP_NONCE__">
      :root {
        --bg: #0b0e13; --surface: #12161d; --surface-2: #171c25; --surface-3: #1d2430;
        --border: #242c38; --border-2: #303a49; --text: #e7ecf3; --muted: #98a5b7; --faint: #6a7688;
        --brand: #6b93ff; --brand-ink: #fff; --brand-bg: rgba(107,147,255,.14);
        --ok: #34c88a; --ok-bg: rgba(52,200,138,.13);
        --warn: #e6ab35; --warn-bg: rgba(230,171,53,.13);
        --err: #f0625b; --err-bg: rgba(240,98,91,.13);
        --r: 12px; --r-sm: 8px; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.22);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f6f8fb; --surface: #ffffff; --surface-2: #f3f6fa; --surface-3: #eef2f7;
          --border: #e5e9f0; --border-2: #d6dde7; --text: #18202e; --muted: #5a6675; --faint: #8b95a4;
          --brand: #3d6bff; --brand-bg: rgba(61,107,255,.10);
          --ok: #17a06a; --ok-bg: rgba(23,160,106,.10);
          --warn: #b9821a; --warn-bg: rgba(185,130,26,.12);
          --err: #dc4b45; --err-bg: rgba(220,75,69,.10);
          --shadow: 0 1px 2px rgba(16,24,40,.05), 0 10px 28px rgba(16,24,40,.06);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg); color: var(--text);
        font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      a { color: var(--brand); text-decoration: none; }
      h1, h2, h3, p { margin: 0; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
      .muted { color: var(--muted); }
      .small { font-size: 12.5px; }
      svg { display: block; }

      /* ---- Buttons ---- */
      .btn {
        display: inline-flex; align-items: center; gap: 7px; font: inherit; font-weight: 550; cursor: pointer;
        border: 1px solid var(--border-2); background: var(--surface); color: var(--text);
        padding: 8px 13px; border-radius: var(--r-sm); transition: background .12s, border-color .12s, opacity .12s;
        white-space: nowrap; line-height: 1;
      }
      .btn svg { width: 15px; height: 15px; }
      .btn:hover { background: var(--surface-3); border-color: var(--faint); }
      .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
      .btn.primary:hover { filter: brightness(1.06); }
      .btn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); }
      .btn.danger:hover { background: var(--err-bg); }
      .btn.subtle { background: transparent; border-color: transparent; color: var(--muted); padding: 6px 9px; }
      .btn.subtle:hover { background: var(--surface-3); color: var(--text); }
      .btn.sm { padding: 5px 9px; font-size: 12.5px; }
      .btn:disabled { opacity: .55; cursor: not-allowed; }
      .btn.iconbtn { padding: 8px; }
      .link-btn { background: none; border: 0; color: var(--brand); cursor: pointer; font: inherit; padding: 0; }

      input, select {
        font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border-2);
        border-radius: var(--r-sm); padding: 9px 11px; transition: border-color .12s, box-shadow .12s;
      }
      input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-bg); }
      .search { position: relative; }
      .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); }
      .search input { padding-left: 33px; min-width: 240px; }

      /* ---- Layout ---- */
      .app { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
      .side { background: var(--surface); border-right: 1px solid var(--border); padding: 18px 14px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
      .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; padding: 4px 8px 20px; }
      .brand .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--brand), #9b6bff); display: grid; place-items: center; box-shadow: 0 2px 8px var(--brand-bg); }
      .brand .logo svg { width: 16px; height: 16px; color: #fff; }
      .nav { display: flex; flex-direction: column; gap: 2px; }
      .nav a { display: flex; align-items: center; gap: 11px; padding: 9px 11px; border-radius: var(--r-sm); color: var(--muted); font-weight: 550; position: relative; }
      .nav a svg { width: 18px; height: 18px; }
      .nav a:hover { background: var(--surface-2); color: var(--text); }
      .nav a.active { background: var(--brand-bg); color: var(--brand); }
      .side .foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
      .side .foot .ver { color: var(--faint); font-size: 12px; padding: 0 8px; }
      .side .foot a { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 13px; padding: 6px 8px; border-radius: var(--r-sm); }
      .side .foot a:hover { background: var(--surface-2); color: var(--text); }
      .side .foot a svg { width: 16px; height: 16px; }

      .main { padding: 26px 30px 60px; max-width: 1280px; width: 100%; }
      .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
      .head h1 { font-size: 21px; font-weight: 680; letter-spacing: -.01em; }
      .head .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
      .head .actions { display: flex; gap: 8px; flex-wrap: wrap; }

      /* ---- Cards / stats ---- */
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); }
      .card.pad { padding: 18px; }
      .stat { padding: 17px 18px; display: flex; flex-direction: column; gap: 2px; }
      .stat .top { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
      .stat .top .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--brand-bg); color: var(--brand); }
      .stat .top .ic svg { width: 16px; height: 16px; }
      .stat .top .lbl { display: flex; align-items: center; gap: 5px; }
      .stat .v { font-size: 27px; font-weight: 720; letter-spacing: -.02em; margin-top: 8px; }
      .stat .foot { color: var(--muted); font-size: 12.5px; }
      .stat.warn .top .ic { background: var(--warn-bg); color: var(--warn); }
      .stat.err .top .ic { background: var(--err-bg); color: var(--err); }

      /* ---- Section ---- */
      .section-title { display: flex; align-items: center; gap: 6px; font-weight: 620; font-size: 14px; margin: 22px 0 10px; }

      /* ---- Table ---- */
      .tablewrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); overflow: auto; box-shadow: var(--shadow); }
      table { width: 100%; border-collapse: collapse; }
      thead th { position: sticky; top: 0; background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap; }
      thead th .th { display: inline-flex; align-items: center; gap: 5px; }
      tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
      tbody tr:last-child td { border-bottom: 0; }
      tbody tr.click { cursor: pointer; }
      tbody tr.click:hover { background: var(--surface-2); }
      td.nowrap { white-space: nowrap; }

      /* ---- Badges / bars ---- */
      .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-3); color: var(--muted); border: 1px solid transparent; white-space: nowrap; }
      .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .badge.ok { color: var(--ok); background: var(--ok-bg); }
      .badge.err { color: var(--err); background: var(--err-bg); }
      .badge.warn { color: var(--warn); background: var(--warn-bg); }
      .badge.brand { color: var(--brand); background: var(--brand-bg); }
      .bar { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; min-width: 80px; }
      .bar > i { display: block; height: 100%; background: var(--brand); border-radius: 999px; }

      .kv { display: grid; grid-template-columns: 220px 1fr; gap: 12px 16px; }
      .kv .k { color: var(--muted); display: flex; align-items: center; gap: 5px; }
      .kv .v { color: var(--text); }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .spacer { flex: 1; }

      /* ---- Tabs ---- */
      .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 20px 0 16px; flex-wrap: wrap; }
      .tabs button { border: 0; background: none; color: var(--muted); border-bottom: 2px solid transparent; border-radius: 0; padding: 9px 13px; font: inherit; font-weight: 550; cursor: pointer; margin-bottom: -1px; }
      .tabs button:hover { color: var(--text); }
      .tabs button.active { color: var(--brand); border-bottom-color: var(--brand); }

      /* ---- Payload ---- */
      .payload-wrap { min-width: 240px; max-width: 440px; }
      .idcell { white-space: nowrap; }
      .payload-box { position: relative; }
      pre.payload { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; overflow: hidden; }
      .payload-box.clamp pre.payload { max-height: 118px; }
      .payload-box.clamp::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 40px; background: linear-gradient(transparent, var(--surface-2)); pointer-events: none; border-radius: 0 0 var(--r-sm) var(--r-sm); }
      .payload-box.expanded pre.payload { max-height: 420px; overflow: auto; }
      .payload-box.expanded::after { display: none; }
      .payload-bar { display: flex; gap: 12px; align-items: center; margin-top: 7px; }

      /* ---- Empty / skeleton ---- */
      .empty { color: var(--muted); padding: 40px 20px; text-align: center; }
      .empty .ic { width: 40px; height: 40px; margin: 0 auto 12px; color: var(--faint); }
      .empty .ic svg { width: 40px; height: 40px; }
      .skel { display: inline-block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: sh 1.2s infinite; }
      @keyframes sh { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
      .spin { width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .7s linear infinite; display: inline-block; }
      @keyframes rot { to { transform: rotate(360deg); } }

      /* ---- Paginator ---- */
      .paginator { display: flex; gap: 10px; align-items: center; justify-content: flex-end; margin-top: 12px; color: var(--muted); font-size: 13px; }
      .paginator .btn { padding: 6px 9px; }

      /* ---- Tooltip trigger ---- */
      .tip { display: inline-flex; align-items: center; color: var(--faint); cursor: help; }
      .tip svg { width: 14px; height: 14px; }
      .tip:hover, .tip:focus { color: var(--brand); outline: none; }
      #tt { position: fixed; z-index: 100; max-width: 280px; background: #0d1117; color: #e7ecf3; border: 1px solid #2a2f3a; border-radius: 8px; padding: 8px 11px; font-size: 12.5px; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,.35); pointer-events: none; opacity: 0; transform: translateY(3px); transition: opacity .12s, transform .12s; }
      #tt.on { opacity: 1; transform: translateY(0); }

      /* ---- Modal ---- */
      .modal-overlay { position: fixed; inset: 0; background: rgba(4,7,12,.55); backdrop-filter: blur(2px); display: grid; place-items: center; z-index: 90; padding: 20px; }
      .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); width: 440px; max-width: 100%; overflow: hidden; }
      .modal-head { display: flex; align-items: center; gap: 11px; padding: 18px 20px 4px; }
      .modal-head .ic { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--brand-bg); color: var(--brand); flex: none; }
      .modal-head.danger .ic { background: var(--err-bg); color: var(--err); }
      .modal-head .ic svg { width: 18px; height: 18px; }
      .modal-head h3 { font-size: 16px; font-weight: 650; }
      .modal-body { padding: 6px 20px 18px 65px; color: var(--text); }
      .modal-body .d { color: var(--muted); font-size: 13px; margin-top: 8px; }
      .modal-foot { display: flex; justify-content: flex-end; gap: 9px; padding: 14px 20px; background: var(--surface-2); border-top: 1px solid var(--border); }

      /* ---- Toast ---- */
      #toast { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 110; }
      .toast { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--brand); padding: 12px 15px; border-radius: var(--r-sm); box-shadow: var(--shadow); max-width: 360px; animation: slidein .18s ease; }
      .toast.ok { border-left-color: var(--ok); } .toast.ok svg { color: var(--ok); }
      .toast.err { border-left-color: var(--err); } .toast.err svg { color: var(--err); }
      .toast svg { width: 17px; height: 17px; color: var(--brand); flex: none; }
      @keyframes slidein { from { opacity: 0; transform: translateX(16px); } }

      /* ---- Login ---- */
      .login { display: grid; place-items: center; min-height: 100vh; padding: 20px; }
      .login .box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 34px; width: 380px; max-width: 100%; box-shadow: var(--shadow); }
      .login h1 { font-size: 19px; margin: 14px 0 6px; }
      .login p { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
      .login form { display: flex; flex-direction: column; gap: 12px; }
      .login input { padding: 11px 13px; }
      .err-note { color: var(--err); font-size: 13px; min-height: 18px; display: flex; align-items: center; gap: 6px; }
      .err-note:empty { display: none; }

      @media (max-width: 820px) {
        .app { grid-template-columns: 1fr; }
        .side { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px 12px; }
        .side .brand { padding: 4px 10px 4px 4px; }
        .nav { flex-direction: row; }
        .nav a span { display: none; }
        .side .foot { margin: 0 0 0 auto; border: 0; padding: 0; flex-direction: row; }
        .side .foot .ver { display: none; }
        .main { padding: 18px 16px 50px; }
      }
    </style>
  </head>

        const t = el('div', { class: 'toast ' + (kind || 'ok') }, [ico(kind === 'err' ? 'alert' : 'check'), el('span', { text: msg })]);
        $('#toast').appendChild(t);
        setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 200); }, 4200);
      }

      // ================================================================= modal / confirm
      function confirmDialog(o) {
        return new Promise((resolve) => {
          const done = (v) => { document.removeEventListener('keydown', onKey); overlay.remove(); resolve(v); };
          const onKey = (e) => { if (e.key === 'Escape') done(false); };
          const confirmBtn = el('button', { class: 'btn ' + (o.danger ? 'danger' : 'primary'), onclick: () => done(true) }, [o.icon ? ico(o.icon) : null, el('span', { text: o.confirmLabel || 'Confirmer' })]);
          const card = el('div', { class: 'modal' }, [
            el('div', { class: 'modal-head ' + (o.danger ? 'danger' : '') }, [el('span', { class: 'ic' }, [ico(o.danger ? 'alert' : 'info')]), el('h3', { text: o.title })]),
            el('div', { class: 'modal-body' }, [el('div', { text: o.message }), o.detail ? el('div', { class: 'd', text: o.detail }) : null]),
            el('div', { class: 'modal-foot' }, [el('button', { class: 'btn', text: 'Annuler', onclick: () => done(false) }), confirmBtn]),
          ]);
          const overlay = el('div', { class: 'modal-overlay', onclick: (e) => { if (e.target === overlay) done(false); } }, [card]);
          document.body.appendChild(overlay);
          document.addEventListener('keydown', onKey);
          confirmBtn.focus();
        });
      }

      // ================================================================= state + api
      const state = { csrf: null, view: 'dashboard', instId: null, tab: 'overview' };
      async function api(path, opts) {
        opts = opts || {};
        const headers = Object.assign({}, opts.headers);
        if (opts.body != null) headers['content-type'] = 'application/json';
        if (state.csrf && opts.method && opts.method !== 'GET') headers['x-csrf-token'] = state.csrf;
        const res = await fetch(path, { method: opts.method || 'GET', credentials: 'same-origin', headers, body: opts.body != null ? JSON.stringify(opts.body) : undefined });
        if (res.status === 401) { state.csrf = null; renderLogin('Session expirée, reconnectez-vous.'); throw new Error('unauthorized'); }
        const text = await res.text();
        const json = text ? JSON.parse(text) : {};
        if (!res.ok) throw new Error((json && json.error) || ('HTTP ' + res.status));
        return json;
      }
      async function post(path, body) { return api(path, { method: 'POST', body: body || {} }); }

      // A button that runs an async action, with optional confirm dialog + inline spinner.
      function actionBtn(o) {
        const label = el('span', { text: o.label });
        const btn = el('button', { class: 'btn ' + (o.variant || '') }, [o.icon ? ico(o.icon) : null, label]);
        btn.addEventListener('click', async () => {
          if (o.confirm) { const ok = await confirmDialog(o.confirm); if (!ok) return; }
          const kids = Array.from(btn.childNodes);
          btn.disabled = true; clear(btn); btn.appendChild(el('span', { class: 'spin' })); btn.appendChild(el('span', { text: '  ' + o.label }));
          try { await o.run(); if (o.toast) toast(o.toast); if (o.after) o.after(); }
          catch (e) { if (e.message !== 'unauthorized') toast(e.message, 'err'); }
          finally { btn.disabled = false; clear(btn); kids.forEach((k) => btn.appendChild(k)); }
        });
        return btn;
      }

      // ================================================================= login
      function renderLogin(note) {
        const root = clear($('#root'));
        const err = el('div', { class: 'err-note' }, note ? [ico('alert'), el('span', { text: note })] : []);
        const input = el('input', { type: 'password', placeholder: 'Jeton administrateur', autocomplete: 'current-password' });
        const btn = el('button', { class: 'btn primary', type: 'submit', text: 'Se connecter', style: 'justify-content:center' });
        const form = el('form', {
          onsubmit: async (e) => {
            e.preventDefault(); btn.disabled = true; clear(err);
            try { const r = await api('/admin/session', { method: 'POST', body: { token: input.value } }); state.csrf = r.csrf; input.value = ''; go('dashboard'); }
            catch (_) { clear(err); err.appendChild(ico('alert')); err.appendChild(el('span', { text: 'Jeton invalide.' })); }
            finally { btn.disabled = false; }
          },
        }, [input, btn, err]);
        root.appendChild(el('div', { class: 'login' }, [
          el('div', { class: 'box' }, [
            el('div', { class: 'brand', style: 'padding:0' }, [el('span', { class: 'logo' }, [ico('spark')]), el('span', { text: 'ShopiMind' })]),
            el('h1', { text: 'Console d’exploitation' }),
            el('p', { text: 'Espace d’exploitation local de cette intégration. Aucune donnée ne quitte votre infrastructure.' }),
            form,
          ]),
        ]));
        input.focus();
      }

      // ================================================================= shell
      const NAV = [
        { id: 'dashboard', label: 'Tableau de bord', icon: 'grid' },
        { id: 'installations', label: 'Installations', icon: 'plug' },
        { id: 'rejected', label: 'Rejets', icon: 'alert' },
        { id: 'audit', label: 'Journal d’audit', icon: 'clipboard' },
      ];
      function shell(title, sub, body, actions) {
        const root = clear($('#root'));
        const nav = el('nav', { class: 'nav' }, NAV.map((it) =>
          el('a', { href: '#' + it.id, class: state.view === it.id ? 'active' : '', onclick: (e) => { e.preventDefault(); go(it.id); } }, [ico(it.icon), el('span', { text: it.label })])));
        const side = el('aside', { class: 'side' }, [
          el('div', { class: 'brand' }, [el('span', { class: 'logo' }, [ico('spark')]), el('span', { text: 'ShopiMind' })]),
          nav,
          el('div', { class: 'foot' }, [
            el('div', { class: 'ver', id: 'kitver', text: '' }),
            el('a', { href: '#', onclick: async (e) => { e.preventDefault(); if (!(await confirmDialog({ title: 'Se déconnecter ?', message: 'Votre session sera fermée sur cet appareil.', confirmLabel: 'Se déconnecter' }))) return; try { await api('/admin/session', { method: 'DELETE' }); } catch (_) {} state.csrf = null; renderLogin('Déconnecté.'); } }, [ico('logout'), el('span', { text: 'Se déconnecter' })]),
          ]),
        ]);
        const main = el('main', { class: 'main' }, [
          el('div', { class: 'head' }, [
            el('div', {}, [el('h1', { text: title }), sub ? el('div', { class: 'sub', text: sub }) : null]),

          ]),

        root.appendChild(el('div', { class: 'app' }, [side, main]));
        const kv = $('#kitver'); if (kv && state.kitVersion) kv.textContent = 'kit v' + state.kitVersion;
      }

      // ================================================================= building blocks
      function badge(text, kind, withDot) { return el('span', { class: 'badge ' + (kind || '') }, [withDot ? el('span', { class: 'dot' }) : null, el('span', { text: text || '—' })]); }
      function statusBadge(s) { const k = s === 'active' ? 'ok' : s === 'uninstalled' ? 'err' : ''; return badge(s || '—', k, true); }
      function runBadge(s) { const k = s === 'ok' ? 'ok' : s === 'partial' ? 'warn' : s === 'failed' ? 'err' : ''; return badge(s || '—', k); }
      function summarize(j) { try { const s = JSON.parse(j); return [s.mode, s.status].filter(Boolean).join(' · ') + (s.errors && s.errors.length ? ' · ' + s.errors.length + ' err' : ''); } catch (_) { return '—'; } }

      function table(cols, rows, opts) {
        opts = opts || {};
        const head = el('thead', {}, el('tr', {}, cols.map((c) => el('th', {}, [typeof c === 'object' ? c : el('span', { text: c })]))));
        let bodyRows;
        if (opts.loading) bodyRows = Array.from({ length: opts.loading }, () => el('tr', {}, cols.map(() => el('td', {}, [el('span', { class: 'skel', style: 'width:' + (40 + Math.floor(Math.random() * 45)) + '%' })]))));
        else if (!rows.length) bodyRows = [el('tr', {}, el('td', { colspan: String(cols.length) }, [el('div', { class: 'empty' }, [el('div', { class: 'ic' }, [ico('empty')]), el('div', { text: opts.emptyText || 'Aucun élément.' })])]))];
        else bodyRows = rows.map((r, i) => el('tr', opts.onRow ? { class: 'click', onclick: () => opts.onRow(i) } : {}, r.map((cell) => (typeof cell === 'object' && cell !== null ? el('td', {}, [cell]) : el('td', { class: 'nowrap', text: cell == null ? '—' : String(cell) })))));
        return el('table', {}, [head, el('tbody', {}, bodyRows)]);
      }
      function tableCard(cols, rows, opts) { return el('div', { class: 'tablewrap' }, [table(cols, rows, opts)]); }

      function paginator(page, total, onGo) {
        const pages = Math.max(1, Math.ceil(total / page.limit));
        const cur = Math.floor(page.offset / page.limit) + 1;
        if (total <= page.limit) return null;
        return el('div', { class: 'paginator' }, [
          el('span', { text: total + ' élément' + (total > 1 ? 's' : '') }),
          prevBtn(page, onGo), el('span', { text: cur + ' / ' + pages }), nextBtn(page, cur, pages, onGo),
        ]);
      }
      function prevBtn(page, onGo) { const b = el('button', { class: 'btn sm', disabled: page.offset <= 0 ? '' : null, onclick: () => onGo(Math.max(0, page.offset - page.limit)), title: 'Précédent' }); const s = ico('chevron'); s.style.transform = 'rotate(180deg)'; b.appendChild(s); return b; }
      function nextBtn(page, cur, pages, onGo) { const b = el('button', { class: 'btn sm', disabled: cur >= pages ? '' : null, onclick: () => onGo(page.offset + page.limit), title: 'Suivant' }); b.appendChild(ico('chevron')); return b; }

      // Masked payload cell: pretty-printed, clamped when long, with expand + audited reveal.
      function payloadCell(revealPath, masked) {
        const txt = pretty(masked);
        const long = txt.split('\n').length > 6 || txt.length > 320;
        const pre = el('pre', { class: 'payload', text: txt });
        const box = el('div', { class: 'payload-box' + (long ? ' clamp' : '') }, [pre]);
        const bar = el('div', { class: 'payload-bar' });
        if (long) {
          let open = false;
          const t = el('button', { class: 'link-btn', text: 'Développer' });
          t.addEventListener('click', () => { open = !open; box.classList.toggle('clamp', !open); box.classList.toggle('expanded', open); t.textContent = open ? 'Réduire' : 'Développer'; });
          bar.appendChild(t);
        }
        if (revealPath) {
          const reveal = actionBtn({
            label: 'Révéler', icon: 'eye', variant: 'subtle',
            confirm: { title: 'Afficher la charge en clair ?', message: 'La charge utile sera affichée non masquée.', detail: 'Cet accès est journalisé dans le journal d’audit.', confirmLabel: 'Révéler', icon: 'eye' },
            run: async () => { const r = await post(revealPath); pre.textContent = pretty(r.payload_json); box.classList.remove('clamp'); reveal.replaceWith(el('span', { class: 'muted small' }, [ico('check'), el('span', { text: ' Révélé (audité)' })])); },
          });
          bar.appendChild(reveal);
        }
        return el('div', { class: 'payload-wrap' }, [box, bar.childNodes.length ? bar : null]);
      }

      // ================================================================= dashboard
      const TIPS = {
        installations: 'Boutiques ayant installé cette intégration, réparties par statut (active / inactive / désinstallée).',
        webhooks: 'Événements de cycle de vie reçus de ShopiMind sur les dernières 24 h, et combien ont été refusés (signature invalide).',
        rejected: 'Éléments refusés par l’API ShopiMind lors d’un push en masse (validation). Ils sont conservés (dead-letter) pour inspection puis rejeu.',
        cursor: 'Position de synchronisation par entité et source : jusqu’où les données ont été poussées. Le curseur n’avance que si le run se termine sans erreur.',
        failures: 'Nombre d’échecs consécutifs de ce curseur. Déclenche un backoff exponentiel ; remis à zéro à la première réussite.',
        signatures: 'Signatures de webhooks conservées sur 7 jours pour la protection anti-rejeu (idempotence).',
        rejectsCount: 'Nombre d’éléments actuellement en dead-letter pour cette installation.',

        installId: 'Jeton d’installation opaque émis par ShopiMind. À ne jamais interpréter.',
        encrypted: 'Les secrets (clés API) sont chiffrés au repos et JAMAIS renvoyés. Seules les métadonnées (longueur, date) sont visibles.',

      };
      const ACT = {
        sync: 'Lance une synchronisation incrémentale : ne récupère que les données modifiées depuis le dernier curseur. Sûr et rapide.',
        backfill: 'Relance une synchronisation COMPLÈTE (backfill) depuis le début de l’historique. Peut être long et coûteux en appels API.',

      };

      async function renderDashboard() {
        shell('Tableau de bord', 'Vue d’ensemble de l’intégration', el('div', { class: 'grid' }, [1, 2, 3].map(() => el('div', { class: 'card stat' }, [el('span', { class: 'skel', style: 'width:50%' }), el('span', { class: 'skel', style: 'width:30%;height:24px;margin-top:10px' })]))));
        const m = await api('/admin/meta');
        state.kitVersion = m.kitVersion;

        const statusStr = Object.keys(byStatus).map((k) => k + ': ' + byStatus[k]).join(' · ') || 'aucune';
        const cards = el('div', { class: 'grid' }, [

          statCard('sync', 'Webhooks (24 h)', m.webhooks24h.total, m.webhooks24h.refused + ' refusé' + (m.webhooks24h.refused > 1 ? 's' : ''), TIPS.webhooks, m.webhooks24h.refused > 0 ? 'warn' : ''),
          statCard('alert', 'Rejets (dead-letter)', m.rejected.total, m.rejected.byEntity[0] ? 'top : ' + m.rejected.byEntity[0].entity : 'aucun', TIPS.rejected, m.rejected.total > 0 ? 'err' : ''),
        ]);
        const byEntity = m.rejected.byEntity || [];
        const max = byEntity.reduce((a, r) => Math.max(a, r.n), 0) || 1;
        const detail = byEntity.length ? el('div', {}, [

          tableCard([th('Entité'), th('Rejets'), ''], byEntity.map((r) => [
            r.entity || '—', String(r.n),
            el('div', { class: 'bar', style: 'max-width:260px' }, [el('i', { style: 'width:' + Math.round((r.n / max) * 100) + '%' })]),
          ])),
        ]) : null;
        shell('Tableau de bord', 'Généré ' + fmtDate(m.generatedAt) + ' · kit v' + (m.kitVersion || '?'), el('div', {}, [cards, detail]));
      }
      function statCard(icon, label, value, foot, help, kind) {
        return el('div', { class: 'card stat ' + (kind || '') }, [
          el('div', { class: 'top' }, [el('span', { class: 'ic' }, [ico(icon)]), el('span', { class: 'lbl' }, [el('span', { text: label }), help ? tip(help) : null])]),
          el('div', { class: 'v', text: String(value) }),
          el('div', { class: 'foot', text: foot }),
        ]);

      // ================================================================= installations
      const instPage = { limit: 25, offset: 0, q: '', status: '' };
      function filterBar(inputEl, extra, onApply) {
        const search = el('div', { class: 'search' }, [ico('search'), inputEl]);
        inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') onApply(); });
        return el('div', { class: 'row', style: 'margin-bottom:16px' }, [search].concat(extra || []).concat([el('button', { class: 'btn', text: 'Filtrer', onclick: onApply })]));
      }
      async function renderInstallations() {
        const q = el('input', { placeholder: 'Rechercher (id, domaine, nom)…', value: instPage.q });
        const sel = el('select', {}, [['', 'Tous les statuts'], ['active', 'active'], ['inactive', 'inactive'], ['uninstalled', 'uninstalled']].map((o) => el('option', { value: o[0], text: o[1], selected: instPage.status === o[0] ? '' : null })));
        const apply = () => { instPage.q = q.value.trim(); instPage.status = sel.value; instPage.offset = 0; renderInstallations(); };
        sel.addEventListener('change', apply);
        const bar = filterBar(q, [sel], apply);

        const rows = res.items.map((it) => [

        shell('Installations', res.total + ' installation' + (res.total > 1 ? 's' : ''), el('div', {}, [

      }

      // ================================================================= installation detail
      const TABS = [
        { id: 'overview', label: 'Aperçu' }, { id: 'runs', label: 'Synchros' }, { id: 'webhooks', label: 'Webhooks' },
        { id: 'inbound', label: 'Entrants' }, { id: 'state', label: 'État' }, { id: 'rejected', label: 'Rejets' },
      ];
      const enc = encodeURIComponent;
      async function renderInstallation(id) {
        const d = await api('/admin/installations/' + enc(id));
        const inst = d.install;
        const back = el('button', { class: 'btn subtle', onclick: () => go('installations') }, [(function () { const s = ico('chevron'); s.style.transform = 'rotate(180deg)'; return s; })(), el('span', { text: 'Installations' })]);
        const header = el('div', { class: 'card pad', style: 'margin-bottom:14px' }, [
          el('div', { class: 'row' }, [el('span', { class: 'mono', style: 'font-size:13px', text: inst.installation_id }), statusBadge(inst.status)]),
          el('div', { class: 'kv', style: 'margin-top:16px' }, [
            el('div', { class: 'k' }, ['Boutique']), el('div', { class: 'v', text: (inst.shop_name || '—') + (inst.shop_domain ? ' · ' + inst.shop_domain : '') }),
            el('div', { class: 'k' }, ['Compte intégrateur', tip(TIPS.externalAccount)]), el('div', { class: 'v', text: inst.external_account_name || inst.external_account_ref || '—' }),
            el('div', { class: 'k' }, ['Installée / activée']), el('div', { class: 'v', text: fmtDate(inst.installed_at) + '  /  ' + fmtDate(inst.activated_at) }),
            el('div', { class: 'k' }, ['Rejets / signatures (7 j)', tip(TIPS.rejectsCount + ' — ' + TIPS.signatures)]), el('div', { class: 'v', text: d.rejectedCount + ' / ' + d.seenSignatures7d }),
          ]),

        const actions = el('div', { class: 'row', style: 'margin:0 0 4px' }, [
          actionBtn({ label: 'Synchroniser', icon: 'sync', variant: 'primary', toast: 'Synchronisation incrémentale lancée.', run: () => post('/admin/sync/' + enc(id)), after: rerender }),
          actionBtn({ label: 'Backfill complet', icon: 'backfill', confirm: { title: 'Lancer un backfill complet ?', message: ACT.backfill, detail: 'À réserver à une re-synchronisation initiale ou une reprise après incident.', confirmLabel: 'Lancer le backfill', icon: 'backfill' }, toast: 'Backfill complet lancé.', run: () => post('/admin/sync/' + enc(id) + '?full=true'), after: rerender }),
          actionBtn({ label: 'Reprovisionner', icon: 'cog', confirm: { title: 'Reprovisionner ?', message: ACT.reprovision, confirmLabel: 'Reprovisionner', icon: 'cog' }, toast: 'Provisioning relancé.', run: () => post('/admin/installations/' + enc(id) + '/reprovision'), after: rerender }),
          el('span', { class: 'tip', tabindex: '0', 'data-tip': ACT.sync + '\n\n' + ACT.backfill }, [ico('info')]),
        ]);
        const tabsBar = el('div', { class: 'tabs' }, TABS.map((t) => el('button', { class: state.tab === t.id ? 'active' : '', text: t.label, onclick: () => { state.tab = t.id; renderInstallation(id); } })));
        const panel = el('div', {}, [tableCard(['', '', ''], [], { loading: 3 })]);
        shell('Installation', inst.shop_name || inst.installation_id, el('div', {}, [header, actions, tabsBar, panel]), [back]);

      }

      async function renderTab(id, d, panel) {
        try {
          if (state.tab === 'overview') return fillOverview(d, panel);
          if (state.tab === 'runs') return fillPaged('/admin/installations/' + enc(id) + '/runs', panel,
            [th('Run'), th('Statut'), th('Démarré'), th('Terminé'), th('Résumé')],
            (r) => [r.id, runBadge(r.status), fmtDate(r.started_at), fmtDate(r.finished_at), summarize(r.summary_json)]);
          if (state.tab === 'webhooks') return fillPaged('/admin/installations/' + enc(id) + '/webhooks', panel,
            [th('Événement'), th('Signature', TIPS.signatureOk), th('Reçu'), th('Charge utile (masquée)')],
            (r) => [r.event, r.signature_ok ? badge('ok', 'ok') : badge('refusée', 'err'), fmtDate(r.created_at), payloadCell('/admin/installations/' + enc(id) + '/webhook-log/' + r.id + '/reveal', r.payload_json)]);

          if (state.tab === 'state') return fillState('/admin/installations/' + enc(id) + '/state', panel);
          if (state.tab === 'rejected') return fillPaged('/admin/rejected?installationId=' + enc(id), panel,
            [th('Entité'), th('Raison'), th('Créé'), th('Charge utile (masquée)'), th('Action')],
            (r) => [r.entity, r.reason, fmtDate(r.created_at), payloadCell('/admin/rejected/' + r.id + '/reveal', r.payload_json), purgeBtn(r.installation_id, r.id, () => renderInstallation(id))]);

      function purgeBtn(installationId, id, after) {

      function fillOverview(d, panel) {
        clear(panel);
        const cursors = (d.cursors || []).map((c) => [c.entity, c.source_key || '(global)', runBadge(c.last_status), fmtDate(c.last_synced_at), String(c.items), String(c.consecutive_failures)]);
        const runs = (d.recentRuns || []).map((r) => [r.id, runBadge(r.status), fmtDate(r.started_at), summarize(r.summary_json)]);
        panel.appendChild(el('div', {}, [
          el('div', { class: 'section-title' }, ['Curseurs de synchronisation', tip(TIPS.cursor)]),
          tableCard([th('Entité'), th('Source'), th('Statut'), th('Dernière synchro'), th('Items'), th('Échecs', TIPS.failures)], cursors, { emptyText: 'Aucun curseur — aucune synchro n’a encore tourné.' }),
          el('div', { class: 'section-title' }, ['Synchros récentes', d.lastWebhook ? el('span', { class: 'muted small', text: '· dernier webhook : ' + d.lastWebhook.event + ' (' + fmtDate(d.lastWebhook.created_at) + ')' }) : null]),
          tableCard([th('Run'), th('Statut'), th('Démarré'), th('Résumé')], runs, { emptyText: 'Aucune synchro récente.' }),
        ]));
      }

      async function fillState(path, panel) {
        clear(panel).appendChild(tableCard(['', '', ''], [], { loading: 3 }));
        const res = await api(path);
        const rows = res.items.map((s) => [
          el('span', { class: 'mono', text: s.key }),
          s.encrypted ? badge('chiffré', 'brand') : badge('clair'),
          String(s.value_length),
          s.encrypted ? el('span', { class: 'muted', text: '•••••• (secret jamais exposé)' }) : el('span', { class: 'mono', text: s.value_preview == null ? '—' : s.value_preview }),
          fmtDate(s.updated_at),
        ]);
        clear(panel).appendChild(tableCard([th('Clé'), th('Type', TIPS.encrypted), th('Longueur'), th('Aperçu'), th('Mise à jour')], rows, { emptyText: 'Aucun état stocké.' }));
      }

      async function fillPaged(basePath, panel, cols, mapRow) {
        const pg = { limit: 25, offset: 0 };
        async function load() {
          clear(panel).appendChild(tableCard(cols, [], { loading: 4 }));
          const sep = basePath.indexOf('?') >= 0 ? '&' : '?';
          const res = await api(basePath + sep + 'limit=' + pg.limit + '&offset=' + pg.offset);
          clear(panel).appendChild(el('div', {}, [tableCard(cols, res.items.map(mapRow), { emptyText: 'Aucun élément.' }), paginator(pg, res.total, (off) => { pg.offset = off; load(); })]));
        }
        return load();
      }

      // ================================================================= global rejected
      const rejPage = { limit: 25, offset: 0, entity: '' };
      async function renderRejected() {
        const ent = el('input', { placeholder: 'Filtrer par entité…', value: rejPage.entity });
        const apply = () => { rejPage.entity = ent.value.trim(); rejPage.offset = 0; renderRejected(); };
        const bar = filterBar(ent, [], apply);
        const cols = [th('Installation', TIPS.installId), th('Entité'), th('Raison'), th('Créé'), th('Charge utile (masquée)'), th('Action')];
        shell('Rejets (dead-letter)', 'Éléments refusés par l’API ShopiMind lors d’un push', el('div', {}, [bar, tableCard(cols, [], { loading: 4 })]));
        const params = new URLSearchParams({ limit: String(rejPage.limit), offset: String(rejPage.offset) });
        if (rejPage.entity) params.set('entity', rejPage.entity);
        const res = await api('/admin/rejected?' + params.toString());
        const rows = res.items.map((r) => [
          idCell(r.installation_id), r.entity, r.reason, fmtDate(r.created_at),
          payloadCell('/admin/rejected/' + r.id + '/reveal', r.payload_json), purgeBtn(r.installation_id, r.id, renderRejected),
        ]);
        shell('Rejets (dead-letter)', res.total + ' rejet' + (res.total > 1 ? 's' : ''), el('div', {}, [
          bar, tableCard(cols, rows, { emptyText: 'Aucun rejet — tout passe. 🎉' }),
          paginator(rejPage, res.total, (off) => { rejPage.offset = off; renderRejected(); }),
        ]));
      }

      // ================================================================= audit
      const auditPage = { limit: 40, offset: 0 };
      const AUDIT_TIP = 'Chaque action d’administration (connexion, synchro, reprovisioning, révélation, purge). Métadonnées uniquement — aucun secret, aucune PII brute.';
      async function renderAudit() {
        const cols = [th('Date'), th('Action', AUDIT_TIP), th('Installation'), th('Cible'), th('Détails'), th('IP')];
        shell('Journal d’audit', 'Actions d’administration (métadonnées uniquement)', el('div', {}, [tableCard(cols, [], { loading: 6 })]));
        const res = await api('/admin/audit?limit=' + auditPage.limit + '&offset=' + auditPage.offset);
        const rows = res.items.map((a) => [fmtDate(a.at), badge(a.action, a.action.indexOf('fail') >= 0 ? 'err' : ''), a.installation_id ? idCell(a.installation_id) : '—', a.target ? idCell(a.target) : '—', a.details_json, a.ip]);
        shell('Journal d’audit', res.total + ' entrée' + (res.total > 1 ? 's' : ''), el('div', {}, [
          tableCard(cols, rows, { emptyText: 'Aucune action enregistrée.' }),
          paginator(auditPage, res.total, (off) => { auditPage.offset = off; renderAudit(); }),
        ]));
      }

      // ================================================================= router
      function go(view, id) {
        state.view = view === 'installation' ? 'installations' : view;
        if (view === 'installation') { state.instId = id; state.tab = 'overview'; }
        const run = { dashboard: renderDashboard, installations: renderInstallations, installation: () => renderInstallation(id), rejected: renderRejected, audit: renderAudit }[view] || renderDashboard;
        Promise.resolve().then(run).catch((e) => { if (e.message !== 'unauthorized') toast('Erreur : ' + e.message, 'err'); });
      }

      // Cold start: try the dashboard; a 401 bounces to the login screen.
      renderDashboard().catch((e) => { if (e.message === 'unauthorized') return; renderLogin(); });
    </script>
  </body>
</html>
